# Configuración general del sitio.
# Los valores marcados con [REVISAR] son provisionales: Dante los confirma.

nombre: "Física PAU Madrid"           # [REVISAR] nombre definitivo del sitio
lema: "Exámenes resueltos paso a paso, teoría y simulaciones para preparar la PAU"
descripcion: >-
  Exámenes de Física de la PAU de Madrid (antes EvAU) resueltos paso a paso,
  teoría, formulario y simulaciones interactivas para 2º de Bachillerato.
idioma: es

# Prefijo de las rutas. Vacío en local; en GitHub Pages lo fija el despliegue
# con la variable de entorno BASE_URL (por ejemplo "/fisica-pau").
base_url: ""

# Mientras la web esté en preparación, false: cada página pide a los buscadores
# que no la indexen (<meta name="robots" content="noindex">) y robots.txt les
# pide que no la rastreen. El día del lanzamiento, cambiar a true.
indexar: false

autor:
  nombre: "Dante"                      # [REVISAR] nombre completo si quieres que aparezca
  titulo: "Físico y profesor particular"

# Datos del titular de la web. La ley (LSSI, art. 10) obliga a publicarlos en el
# aviso legal, y el RGPD a darlos en la política de privacidad. Mientras falte
# alguno, esas páginas lo marcan en rojo con [REVISAR].
titular:
  nombre: ""                           # [REVISAR] nombre y apellidos
  nif: ""                              # [REVISAR] NIF
  domicilio: ""                        # [REVISAR] domicilio (puede ser el fiscal)
  actividad: "Clases particulares de Física y Matemáticas"   # [REVISAR]
  actualizado: "14 de noviembre de 2026"   # fecha de la última revisión de los textos legales

contacto:
  whatsapp: "34665676190"              # número con prefijo, solo cifras
  correo: ""                           # [REVISAR] correo público de contacto
  # Dirección de la aplicación de Google que recibe los resultados de la prueba
  # de nivel y los apunta en una hoja de cálculo (ver herramientas/informes-prueba-nivel.gs).
  informes_url: ""                     # [REVISAR] https://script.google.com/macros/s/.../exec

# Cursos publicados. Para añadir otro (por ejemplo Matemáticas II) basta con
# crear su carpeta con un curso.yaml y añadir aquí su ruta.
cursos:
  - fisica/2-bachillerato
