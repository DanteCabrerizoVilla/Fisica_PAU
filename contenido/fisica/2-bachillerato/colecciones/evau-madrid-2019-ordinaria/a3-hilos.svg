<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="320" height="290" font-family="system-ui, sans-serif" font-size="13">
<title>Hilos en O (0, 0) y A (2, 2) cm, con la corriente saliendo del papel. En P (0, 2) el campo de O apunta hacia −x y el de A hacia −y: el total apunta en diagonal hacia abajo a la izquierda. En Q, punto medio, los campos se anulan. Sobre el hilo A, la fuerza apunta hacia O: se atraen</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="46" y1="230" x2="280" y2="230" stroke="#5a6170" marker-end="url(#p)"/><text x="284" y="234" fill="#5a6170" font-style="italic">x (cm)</text>
<line x1="70" y1="254" x2="70" y2="34.0" stroke="#5a6170" marker-end="url(#p)"/><text x="76" y="38.0" fill="#5a6170" font-style="italic">y (cm)</text>
<circle cx="70.0" cy="230.0" r="9" fill="#fff" stroke="#3a7bd5" stroke-width="2"/><circle cx="70.0" cy="230.0" r="3" fill="#3a7bd5"/><text x="56.0" y="252.0" text-anchor="end" fill="#3a7bd5">O</text>
<circle cx="210.0" cy="90.0" r="9" fill="#fff" stroke="#3a7bd5" stroke-width="2"/><circle cx="210.0" cy="90.0" r="3" fill="#3a7bd5"/><text x="224.0" y="82.0" text-anchor="start" fill="#3a7bd5">A</text>
<line x1="70.0" y1="230.0" x2="210.0" y2="90.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="70.0" cy="90.0" r="4" fill="#1e222b"/><text x="80.0" y="80.0" text-anchor="start" fill="#1e222b">P (0, 2)</text>
<circle cx="140.0" cy="160.0" r="4" fill="#1e222b"/><text x="150.0" y="178.0" text-anchor="start" fill="#1e222b">Q (1, 1): B = 0</text>
<line x1="70.0" y1="90.0" x2="26.0" y2="90.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="22.0" y="106.0" text-anchor="start" fill="#b5451b" font-size="12">B<tspan font-size="10" dy="3">O</tspan></text>
<line x1="70.0" y1="90.0" x2="70.0" y2="134.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="76.0" y="134.0" text-anchor="start" fill="#b5451b" font-size="12">B<tspan font-size="10" dy="3">A</tspan></text>
<line x1="70.0" y1="90.0" x2="26.0" y2="134.0" stroke="#0f6b5c" stroke-width="2.5" marker-end="url(#p)"/>
<text x="22.0" y="148.0" text-anchor="end" fill="#0f6b5c" font-weight="700">B</text>
<line x1="200.0" y1="100.0" x2="160.0" y2="140.0" stroke="#1e222b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="156.0" y="130.0" text-anchor="end" fill="#1e222b" font-weight="700">F/L</text>
</svg>
