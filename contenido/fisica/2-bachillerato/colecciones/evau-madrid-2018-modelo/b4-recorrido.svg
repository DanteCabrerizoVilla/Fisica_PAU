<line x1="218.1" y1="141.4" x2="304.7" y2="91.4" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="257.1" y1="118.9" x2="358.8" y2="160.8" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="151.0" y="103.3" text-anchor="start" fill="#0f6b5c" font-size="12">r = 28,13°</text>
<text x="251.1" y="148.9" text-anchor="end" fill="#0f6b5c" font-size="12">r′ = 31,87°</text>
<text x="317.1" y="84.9" text-anchor="start" fill="#0f6b5c" font-size="12">e = 52,38°</text>
</svg>
