<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" font-family="system-ui, sans-serif" font-size="13">
<title>Con 27,92° de incidencia, el rayo se refracta con 18,19° y llega a la segunda cara con 41,81°, el ángulo límite: sale rasante, a 90°</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<polygon points="200.0,20.0 90.0,210.5 310.0,210.5" fill="rgba(58,123,213,0.14)" stroke="#1e222b" stroke-width="1.5"/>
<text x="200.0" y="64.0" text-anchor="middle" fill="#1e222b" font-size="12">60°</text>
<line x1="25.1" y1="110.9" x2="145.0" y2="115.3" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="97.4" y1="87.8" x2="184.0" y2="137.8" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<text x="83.0" y="75.3" text-anchor="end" fill="#0f6b5c" font-size="12">i = 27,92°</text>
<line x1="145.0" y1="115.3" x2="270.1" y2="141.4" stroke="#b5451b" stroke-width="2"/>
<line x1="231.1" y1="163.9" x2="317.7" y2="113.9" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="270.1" y1="141.4" x2="325.1" y2="236.7" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="151.0" y="103.3" text-anchor="start" fill="#0f6b5c" font-size="12">r = 18,19°</text>
<text x="264.1" y="171.4" text-anchor="end" fill="#0f6b5c" font-size="12">r′ = 41,81°</text>
<text x="330.1" y="107.4" text-anchor="start" fill="#0f6b5c" font-size="12">e = 90°</text>
</svg>
