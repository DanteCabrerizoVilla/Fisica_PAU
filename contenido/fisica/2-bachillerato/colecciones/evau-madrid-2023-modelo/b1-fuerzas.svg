<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="system-ui, sans-serif" font-size="13">
<title>La masa de 5 kg, en el punto (2, 1) m, es atraída por m1 con una fuerza F1 dirigida hacia el origen y por m2 con una fuerza F2 mayor, dirigida verticalmente hacia abajo</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="46" y1="190" x2="340" y2="190" stroke="#5a6170" marker-end="url(#p)"/><text x="344" y="194" fill="#5a6170" font-style="italic">x (m)</text>
<line x1="70" y1="214" x2="70" y2="30" stroke="#5a6170" marker-end="url(#p)"/><text x="76" y="34" fill="#5a6170" font-style="italic">y (m)</text>
<circle cx="70" cy="190" r="9" fill="#5a6170"/><text x="64.0" y="216.0" text-anchor="middle" fill="#1e222b" >m₁ = 10 kg</text>
<circle cx="290" cy="190" r="11" fill="#5a6170"/><text x="294.0" y="218.0" text-anchor="middle" fill="#1e222b" >m₂ = 15 kg</text>
<line x1="70.0" y1="190.0" x2="290.0" y2="80.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="290.0" y1="190.0" x2="290.0" y2="80.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="290.0" y1="80.0" x2="250.0" y2="100.0" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#p)"/>
<text x="242.0" y="92.0" text-anchor="end" fill="#3a7bd5" >F₁</text>
<line x1="290.0" y1="80.0" x2="290.0" y2="158.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="300.0" y="140.0" text-anchor="start" fill="#b5451b" >F₂</text>
<circle cx="290" cy="80" r="7" fill="#0f6b5c"/><text x="302.0" y="72.0" text-anchor="start" fill="#0f6b5c" >5 kg  (2, 1)</text>
<text x="132.0" y="182.0" text-anchor="middle" fill="#5a6170" font-size="12">26,6°</text>
</svg>
