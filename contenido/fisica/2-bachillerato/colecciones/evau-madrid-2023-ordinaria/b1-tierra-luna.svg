<line x1="60.0" y1="126.0" x2="252.0" y2="126.0" stroke="#0f6b5c" marker-start="url(#p)" marker-end="url(#p)"/><text x="156.0" y="142.0" text-anchor="middle" fill="#0f6b5c">x</text>
<line x1="60.0" y1="14.0" x2="60.0" y2="132.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="340.0" y1="14.0" x2="340.0" y2="50.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="252.0" y1="78.0" x2="252.0" y2="132.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
