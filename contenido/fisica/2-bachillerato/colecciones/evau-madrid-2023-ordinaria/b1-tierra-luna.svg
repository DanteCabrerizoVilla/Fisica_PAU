<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150" font-family="system-ui, sans-serif" font-size="13">
<title>La Tierra y la Luna separadas una distancia d; el satélite está sobre la línea que las une, a una distancia x del centro de la Tierra</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<circle cx="60" cy="70" r="40" fill="rgba(58,123,213,0.25)" stroke="#3a7bd5"/><text x="60.0" y="74.0" text-anchor="middle" fill="#1e222b" >Tierra</text>
<circle cx="340" cy="70" r="16" fill="rgba(90,97,112,0.3)" stroke="#5a6170"/><text x="340.0" y="104.0" text-anchor="middle" fill="#1e222b" >Luna</text>
<line x1="60.0" y1="70.0" x2="340.0" y2="70.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="246" y="64" width="12" height="12" fill="#b5451b"/><text x="252.0" y="56.0" text-anchor="middle" fill="#b5451b" >satélite</text>
