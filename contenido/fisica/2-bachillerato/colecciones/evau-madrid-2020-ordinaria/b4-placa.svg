<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 206" width="400" height="206" font-family="system-ui, sans-serif" font-size="13">
<title>Placa de vidrio de 4 cm entre un aceite de índice 1,4, arriba, y otro de 1,2, abajo. Un rayo llega desde arriba con 30°; parte se refleja en la cara superior y parte entra, se refleja en la cara inferior y vuelve a salir por arriba, paralelo al primer reflejado. La distancia entre los dos es d</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect x="10" y="20" width="360" height="70" fill="rgba(181,69,27,0.10)"/><rect x="10" y="90" width="360" height="70" fill="rgba(58,123,213,0.14)"/><rect x="10" y="160" width="360" height="40" fill="rgba(15,107,92,0.14)"/>
<line x1="10.0" y1="90.0" x2="370.0" y2="90.0" stroke="#1e222b" stroke-width="1.5"/>
<line x1="10.0" y1="160.0" x2="370.0" y2="160.0" stroke="#1e222b" stroke-width="1.5"/>
<text x="20.0" y="40.0" text-anchor="start" fill="#1e222b" font-size="12">aceite, n₁ = 1,4</text>
<text x="20.0" y="112.0" text-anchor="start" fill="#1e222b" font-size="12">vidrio, n₂ = 1,5</text>
<text x="20.0" y="186.0" text-anchor="start" fill="#1e222b" font-size="12">aceite, n₃ = 1,2</text>
<line x1="115.4" y1="30.0" x2="150.0" y2="90.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="150.0" y1="90.0" x2="184.6" y2="30.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="150.0" y1="90.0" x2="186.9" y2="160.0" stroke="#b5451b" stroke-width="2"/>
<line x1="186.9" y1="160.0" x2="223.9" y2="90.0" stroke="#b5451b" stroke-width="2"/>
<line x1="223.9" y1="90.0" x2="258.5" y2="30.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="150.0" y1="24.0" x2="150.0" y2="150.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<text x="142.0" y="52.0" text-anchor="end" fill="#0f6b5c" font-size="12">30°</text>
<line x1="388.0" y1="90.0" x2="388.0" y2="160.0" stroke="#5a6170" marker-start="url(#p)" marker-end="url(#p)"/><text x="388.0" y="119.0" text-anchor="middle" fill="#5a6170"></text>
<text x="380.0" y="130.0" text-anchor="end" fill="#5a6170" font-size="12">4 cm</text>
<line x1="165.0" y1="64.0" x2="220.4" y2="96.0" stroke="#0f6b5c" marker-start="url(#p)" marker-end="url(#p)"/><text x="196.7" y="74.0" text-anchor="start" fill="#0f6b5c" font-style="italic" font-weight="700">d</text>
</svg>
