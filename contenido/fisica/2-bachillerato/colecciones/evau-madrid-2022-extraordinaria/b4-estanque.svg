<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220" font-family="system-ui, sans-serif" font-size="13">
<title>El rayo llega desde el aire con 40° respecto a la normal, se refracta en el aceite con 26,5° y entra en el agua con 28,9°. Las dos superficies son paralelas</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect x="20" y="70" width="300" height="46" fill="rgba(181,69,27,0.14)"/><rect x="20" y="116" width="300" height="94" fill="rgba(58,123,213,0.14)"/>
<line x1="20.0" y1="70.0" x2="320.0" y2="70.0" stroke="#1e222b" stroke-width="1.5"/>
<line x1="20.0" y1="116.0" x2="320.0" y2="116.0" stroke="#1e222b" stroke-width="1.2"/>
<text x="312.0" y="60.0" text-anchor="end" fill="#1e222b" font-size="12">aire, n = 1</text>
<text x="312.0" y="98.0" text-anchor="end" fill="#1e222b" font-size="12">aceite, n = 1,44</text>
<text x="312.0" y="200.0" text-anchor="end" fill="#1e222b" font-size="12">agua, n = 1,33</text>
<line x1="58.0" y1="8.0" x2="110.0" y2="70.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="110.0" y1="70.0" x2="132.9" y2="116.0" stroke="#b5451b" stroke-width="2"/>
<line x1="132.9" y1="116.0" x2="177.1" y2="196.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="110.0" y1="14.0" x2="110.0" y2="108.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="132.9" y1="80.0" x2="132.9" y2="200.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<text x="116.0" y="40.0" text-anchor="start" fill="#0f6b5c" font-size="12">40°</text>
<text x="140.0" y="100.0" text-anchor="start" fill="#0f6b5c" font-size="12">26,5°</text>
<text x="138.9" y="176.0" text-anchor="start" fill="#0f6b5c" font-size="12">28,9°</text>
</svg>
