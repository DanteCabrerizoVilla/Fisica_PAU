<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 200" width="430" height="200" font-family="system-ui, sans-serif" font-size="13">
<title>Trazado de rayos con el objeto a 20 cm de una lente convergente de focal 10 cm: imagen real, invertida y del mismo tamaño a 20 cm</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="10" y1="100" x2="420" y2="100" stroke="#5a6170"/>
<line x1="215.0" y1="20" x2="215.0" y2="180" stroke="#3a7bd5" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)"/>
<circle cx="135.0" cy="100" r="3" fill="#1e222b"/><text x="135.0" y="91" text-anchor="middle" fill="#1e222b" font-style="italic">F</text>
<circle cx="295.0" cy="100" r="3" fill="#1e222b"/><text x="295.0" y="91" text-anchor="middle" fill="#1e222b" font-style="italic">F′</text>
<line x1="55.0" y1="100.0" x2="55.0" y2="68.0" stroke="#1e222b" stroke-width="2.5" marker-end="url(#p)"/>
<line x1="375.0" y1="100.0" x2="375.0" y2="132.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<polyline points="55.0,68.0 215.0,68.0 375.0,132.0" fill="none" stroke="#0f6b5c" stroke-width="1.6"/>
<line x1="55.0" y1="68.0" x2="375.0" y2="132.0" stroke="#0f6b5c" stroke-width="1.6"/>
<polyline points="55.0,68.0 215.0,132.0 375.0,132.0" fill="none" stroke="#0f6b5c" stroke-width="1.6"/>
<text x="55.0" y="60.0" text-anchor="middle" fill="#1e222b">objeto (4 cm)</text><text x="375.0" y="150.0" text-anchor="middle" fill="#b5451b">imagen (4 cm)</text>
<text x="55.0" y="116" text-anchor="middle" fill="#5a6170"><tspan font-style="italic">s</tspan> = −20 cm</text><text x="375.0" y="91" text-anchor="middle" fill="#5a6170"><tspan font-style="italic">s′</tspan> = 20 cm</text>
</svg>
