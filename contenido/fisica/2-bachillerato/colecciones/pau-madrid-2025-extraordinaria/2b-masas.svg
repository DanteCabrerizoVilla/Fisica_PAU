<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 196" width="336" height="196" font-family="system-ui, sans-serif" font-size="13">
<title>Dos masas de 3 kg en (0, 0) y (6, 0) m, con los campos que crean en A (3, 3) m, y el punto B (0, 3) m</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="36" y1="160" x2="318" y2="160" stroke="#5a6170" marker-end="url(#p)"/><text x="322" y="164" fill="#5a6170" font-style="italic">x</text>
<line x1="60" y1="184" x2="60" y2="14" stroke="#5a6170" marker-end="url(#p)"/><text x="66" y="18" fill="#5a6170" font-style="italic">y</text>
<line x1="60" y1="160" x2="168" y2="52" stroke="#5a6170" stroke-dasharray="4 4"/><line x1="276" y1="160" x2="168" y2="52" stroke="#5a6170" stroke-dasharray="4 4"/>
<circle cx="60" cy="160" r="10" fill="#1e222b"/><text x="64" y="186" text-anchor="middle" fill="#1e222b">m₁ = 3 kg</text>
<circle cx="276" cy="160" r="10" fill="#1e222b"/><text x="276" y="186" text-anchor="middle" fill="#1e222b">m₂ = 3 kg</text>
<line x1="168.0" y1="52.0" x2="138.0" y2="82.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="124" y="78" fill="#b5451b" font-style="italic">g₁</text>
<line x1="168.0" y1="52.0" x2="198.0" y2="82.0" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#p)"/>
<text x="204" y="78" fill="#3a7bd5" font-style="italic">g₂</text>
<circle cx="168" cy="52" r="4" fill="#1e222b"/><text x="168" y="42" text-anchor="middle" fill="#1e222b">A (3, 3) m</text>
<circle cx="60" cy="52" r="4" fill="#1e222b"/><text x="68" y="42" fill="#1e222b">B (0, 3) m</text>
