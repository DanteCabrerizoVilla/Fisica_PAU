<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="system-ui, sans-serif" font-size="14">
  <title>Satélite en órbita circular alrededor de la Tierra</title>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="context-stroke"/>
    </marker>
  </defs>
  <circle cx="150" cy="120" r="100" fill="none" stroke="#5a6170" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="150" cy="120" r="62" fill="#cfe2fb" stroke="#3a7bd5" stroke-width="2"/>
  <circle cx="150" cy="120" r="2.5" fill="#1e222b"/>
  <text x="150" y="146" text-anchor="middle" fill="#1e222b">Tierra</text>
  <!-- radio terrestre y altura -->
  <line x1="150" y1="120" x2="212" y2="120" stroke="#1e222b" stroke-width="1.5"/>
  <line x1="212" y1="120" x2="250" y2="120" stroke="#b5451b" stroke-width="2"/>
  <text x="181" y="112" text-anchor="middle" fill="#1e222b" font-style="italic">R<tspan baseline-shift="sub" font-size="10">T</tspan></text>
  <text x="231" y="112" text-anchor="middle" fill="#b5451b" font-style="italic">h</text>
  <!-- satélite y velocidad -->
  <circle cx="250" cy="120" r="6" fill="#1e222b"/>
  <line x1="250" y1="120" x2="250" y2="62" stroke="#0f6b5c" stroke-width="2.5" marker-end="url(#punta)"/>
  <text x="258" y="74" fill="#0f6b5c" font-style="italic">v</text>
  <text x="264" y="140" fill="#1e222b" font-style="italic">m</text>
  <text x="272" y="200" fill="#1e222b"><tspan font-style="italic">r</tspan> = <tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="10">T</tspan> + <tspan font-style="italic">h</tspan></text>
</svg>
