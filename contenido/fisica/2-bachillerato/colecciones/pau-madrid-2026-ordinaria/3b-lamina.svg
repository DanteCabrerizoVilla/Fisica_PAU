<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 206" width="370" height="206" font-family="system-ui, sans-serif" font-size="13">
<title>Rayo que incide a 48° sobre una lámina de 3 cm: parte se refleja (rayo 1) y parte se refracta, se refleja en la cara inferior y sale (rayo 2) a una distancia x del primero</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect x="20" y="62" width="330" height="120" fill="rgba(58,123,213,0.10)" stroke="#3a7bd5" stroke-width="1.5"/>
<line x1="120" y1="6" x2="120" y2="192" stroke="#5a6170" stroke-dasharray="4 4"/>
<line x1="69.5" y1="16.5" x2="120.0" y2="62.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="120.0" y1="62.0" x2="170.5" y2="16.5" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<polyline points="120,62 178.3,182 236.7,62" fill="none" stroke="#b5451b" stroke-width="2"/>
<line x1="236.7" y1="62.0" x2="287.2" y2="16.5" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="174.5" y="18.5" fill="#1e222b">(1)</text><text x="291.2" y="18.5" fill="#1e222b">(2)</text>
<line x1="123" y1="76" x2="233.7" y2="76" stroke="#0f6b5c" marker-start="url(#p)" marker-end="url(#p)"/><text x="178.3" y="92" text-anchor="middle" fill="#0f6b5c" font-style="italic">x</text>
<line x1="36" y1="65" x2="36" y2="179" stroke="#5a6170" marker-start="url(#p)" marker-end="url(#p)"/><text x="44" y="126.0" fill="#5a6170"><tspan font-style="italic">e</tspan> = 3 cm</text>
<text x="98" y="36" fill="#1e222b">48°</text><text x="128" y="120" fill="#1e222b" font-style="italic">θᵣ</text>
<text x="340" y="54" text-anchor="end" fill="#5a6170">Aire</text><text x="340" y="174" text-anchor="end" fill="#3a7bd5">n = 1,7</text><text x="340" y="198" text-anchor="end" fill="#5a6170">Aire</text>
</svg>
