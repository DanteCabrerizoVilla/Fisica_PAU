<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" width="340" height="190" font-family="system-ui, sans-serif" font-size="13">
<title>Cargas positivas de 2 nC en el origen y de 4 nC en (6, 0) m; en el punto (2, 2) m cada campo se aleja de la carga que lo crea</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="16" y1="150" x2="320" y2="150" stroke="#5a6170" marker-end="url(#p)"/><text x="324" y="154" fill="#5a6170" font-style="italic">x</text>
<line x1="40" y1="174" x2="40" y2="14" stroke="#5a6170" marker-end="url(#p)"/><text x="46" y="18" fill="#5a6170" font-style="italic">y</text>
<line x1="40.0" y1="150.0" x2="120.0" y2="70.0" stroke="#5a6170" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="280.0" y1="150.0" x2="120.0" y2="70.0" stroke="#5a6170" stroke-width="1.2" stroke-dasharray="4 4"/>
<circle cx="40" cy="150" r="11" fill="#b5451b"/><text x="40" y="155" text-anchor="middle" fill="#fff" font-weight="700">+</text><text x="40" y="178" text-anchor="middle" fill="#1e222b">q₁ = 2 nC</text>
<circle cx="280" cy="150" r="11" fill="#b5451b"/><text x="280" y="155" text-anchor="middle" fill="#fff" font-weight="700">+</text><text x="280" y="178" text-anchor="middle" fill="#1e222b">q₂ = 4 nC</text>
<line x1="120.0" y1="70.0" x2="150.0" y2="40.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="156.0" y="40.0" text-anchor="start" fill="#b5451b" font-style="italic">E₁</text>
<line x1="120.0" y1="70.0" x2="90.0" y2="55.0" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#p)"/>
<text x="84.0" y="54.0" text-anchor="end" fill="#3a7bd5" font-style="italic">E₂</text>
<circle cx="120.0" cy="70.0" r="4" fill="#1e222b"/><text x="128.0" y="88.0" text-anchor="start" fill="#1e222b">P (2, 2) m</text>
</svg>
