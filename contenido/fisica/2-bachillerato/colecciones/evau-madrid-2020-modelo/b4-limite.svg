<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" font-family="system-ui, sans-serif" font-size="13">
<title>El rayo incide desde el medio 1 con 48,6° respecto a la normal, se refracta en el medio 2 con 59,0° y llega a la superficie con el medio 3 justo con el ángulo límite, de modo que el refractado saldría rasante, a 90°</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="380" height="80" fill="#c9c9c9"/>
<text x="368.0" y="24.0" text-anchor="end" fill="#1e222b" font-size="13">n₁ = 1,6</text>
<text x="368.0" y="42.0" text-anchor="end" fill="#5a6170" font-size="11">medio 1</text>
<rect x="0" y="80" width="380" height="80" fill="#dedede"/>
<text x="368.0" y="104.0" text-anchor="end" fill="#1e222b" font-size="13">n₂ = 1,4</text>
<text x="368.0" y="122.0" text-anchor="end" fill="#5a6170" font-size="11">medio 2</text>
<rect x="0" y="160" width="380" height="80" fill="#f0f0f0"/>
<text x="368.0" y="184.0" text-anchor="end" fill="#1e222b" font-size="13">n₃ = 1,2</text>
<text x="368.0" y="202.0" text-anchor="end" fill="#5a6170" font-size="11">medio 3</text>
<line x1="0.0" y1="80.0" x2="380.0" y2="80.0" stroke="#1e222b" stroke-width="1.5"/>
<line x1="0.0" y1="160.0" x2="380.0" y2="160.0" stroke="#1e222b" stroke-width="1.5"/>
<line x1="120.0" y1="30.0" x2="120.0" y2="130.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="253.1" y1="110.0" x2="253.1" y2="210.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="29.3" y1="0.0" x2="120.0" y2="80.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="120.0" y1="80.0" x2="253.1" y2="160.0" stroke="#b5451b" stroke-width="2"/>
<line x1="253.1" y1="160.0" x2="328.1" y2="160.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="104.0" y="56.0" text-anchor="end" fill="#0f6b5c" font-size="12">48,6°</text>
<text x="142.0" y="112.0" text-anchor="start" fill="#0f6b5c" font-size="12">59,0°</text>
<text x="261.1" y="152.0" text-anchor="start" fill="#0f6b5c" font-size="12">sale rasante</text>
</svg>
