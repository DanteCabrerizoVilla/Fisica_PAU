<circle cx="204" cy="120" r="11" fill="#b5451b"/><text x="204" y="125" text-anchor="middle" fill="#fff" font-weight="700">+</text><text x="204" y="146" text-anchor="middle" fill="#1e222b">2 nC</text>
<circle cx="132" cy="239.51999999999998" r="11" fill="#3a7bd5"/><text x="132" y="244.51999999999998" text-anchor="middle" fill="#fff" font-weight="700">−</text><text x="132" y="243.51999999999998" text-anchor="start" dx="18" fill="#1e222b">−10 nC</text>
<line x1="132.0" y1="48.0" x2="132.0" y2="8.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
