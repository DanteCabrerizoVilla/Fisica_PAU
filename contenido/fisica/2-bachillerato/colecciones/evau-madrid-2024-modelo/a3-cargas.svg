<line x1="60.0" y1="120.0" x2="132.0" y2="48.0" stroke="#5a6170" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="204.0" y1="120.0" x2="132.0" y2="48.0" stroke="#5a6170" stroke-width="1.2" stroke-dasharray="4 4"/>
