<text x="60.0" y="122.0" text-anchor="middle" fill="#1e222b" font-style="italic">θ</text>
<text x="130.0" y="92.0" text-anchor="middle" fill="#1e222b" font-style="italic">θ₂</text>
<text x="138.8" y="70.0" text-anchor="middle" fill="#1e222b" font-style="italic">α</text>
<line x1="310.0" y1="43.0" x2="310.0" y2="157.0" stroke="#0f6b5c" marker-start="url(#p)" marker-end="url(#p)"/><text x="344.0" y="104.0" text-anchor="middle" fill="#0f6b5c">H = 4 cm</text>
<text x="50.0" y="50.0" text-anchor="middle" fill="#5a6170" >aire</text>
<text x="260.0" y="148.0" text-anchor="middle" fill="#3a7bd5" >n = 1,34</text>
</svg>
