<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 180" width="370" height="180" font-family="system-ui, sans-serif" font-size="13">
<title>Paralelepípedo de 4 cm de altura. El rayo entra por la cara lateral izquierda a mitad de altura con ángulo de incidencia theta, se refracta con ángulo theta-2 y sube hasta la cara superior, sobre la que incide con ángulo alfa</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<rect x="90" y="40" width="250" height="120" fill="rgba(58,123,213,0.14)" stroke="#3a7bd5" stroke-width="1.5"/>
<line x1="20.0" y1="100.0" x2="150.0" y2="100.0" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="60.0" y1="152.0" x2="90.0" y2="100.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="90.0" y1="100.0" x2="160.8" y2="40.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
