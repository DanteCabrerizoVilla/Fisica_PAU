<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 226" width="500" height="226" font-family="system-ui, sans-serif" font-size="13">
<title>Dos lentes convergentes iguales separadas 16 cm. El objeto está a 8 cm de la primera, que forma una imagen invertida del mismo tamaño a 8 cm, justo a mitad de camino; la segunda la vuelve a invertir y forma la imagen final a 8 cm a su derecha, derecha e igual que el objeto</title>
