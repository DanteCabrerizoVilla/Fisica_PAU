<circle cx="182.0" cy="92" r="2.5" fill="#1e222b"/><text x="182.0" y="108.0" text-anchor="middle" fill="#1e222b" font-size="11">F′₁</text>
<circle cx="286.0" cy="92" r="2.5" fill="#1e222b"/><text x="286.0" y="108.0" text-anchor="middle" fill="#1e222b" font-size="11">F₂</text>
<circle cx="390.0" cy="92" r="2.5" fill="#1e222b"/><text x="390.0" y="108.0" text-anchor="middle" fill="#1e222b" font-size="11">F′₂</text>
<polyline points="26.0,62.0 130.0,62.0 234.0,122.0 338.0,182.0 442.0,62.0" fill="none" stroke="#0f6b5c" stroke-width="1.5"/>
<polyline points="26.0,62.0 130.0,92.0 234.0,122.0 338.0,152.0 442.0,62.0" fill="none" stroke="#0f6b5c" stroke-width="1.5"/>
<line x1="26.0" y1="92.0" x2="26.0" y2="62.0" stroke="#1e222b" stroke-width="2.5" marker-end="url(#p)"/>
<line x1="234.0" y1="92.0" x2="234.0" y2="122.0" stroke="#5a6170" stroke-width="2" marker-end="url(#p)"/>
<line x1="442.0" y1="92.0" x2="442.0" y2="62.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
