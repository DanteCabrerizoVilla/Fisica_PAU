<circle cx="280.0" cy="170.0" r="4" fill="#1e222b"/><text x="284.0" y="190.0" text-anchor="middle" fill="#1e222b">B · 80 dB</text>
<text x="150.0" y="96.0" text-anchor="middle" fill="#5a6170" >100 m</text>
<text x="292.0" y="110.0" text-anchor="start" fill="#5a6170" font-style="italic">h</text>
