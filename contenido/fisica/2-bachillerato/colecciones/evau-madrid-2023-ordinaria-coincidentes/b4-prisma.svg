<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<polygon points="110,214 210,214 210,41" fill="rgba(58,123,213,0.12)" stroke="#1e222b" stroke-width="1.5"/>
<text x="200.0" y="84.0" text-anchor="middle" fill="#1e222b" font-size="12">30°</text>
<text x="134.0" y="208.0" text-anchor="middle" fill="#1e222b" font-size="12">60°</text>
<line x1="99.4" y1="92.5" x2="198.1" y2="149.5" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="30.0" y1="127.5" x2="160.0" y2="127.5" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="178.0" y="190.0" text-anchor="middle" fill="#1e222b" font-size="12">n = 1,33</text>
<text x="60.0" y="60.0" text-anchor="middle" fill="#1e222b" font-size="12">aire, n = 1</text>
