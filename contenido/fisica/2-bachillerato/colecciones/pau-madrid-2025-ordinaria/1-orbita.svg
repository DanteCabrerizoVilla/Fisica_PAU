<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 200" width="370" height="200" font-family="system-ui, sans-serif" font-size="13">
<title>Órbita elíptica de Eris con el Sol en un foco: afelio a la izquierda, perihelio a la derecha y velocidad en el perihelio perpendicular al radio</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<ellipse cx="195.5" cy="100" rx="133.2" ry="117.7" fill="none" stroke="#1e222b" stroke-width="1.6"/>
<line x1="62.2" y1="100" x2="328.7" y2="100" stroke="#5a6170" stroke-dasharray="4 4"/>
<circle cx="258" cy="100" r="8" fill="#f5a524" stroke="#b5451b"/><text x="258" y="86" text-anchor="middle" fill="#1e222b">Sol</text>
<circle cx="62.2" cy="100" r="4.5" fill="#1e222b"/><text x="70.2" y="90" fill="#1e222b">afelio</text>
<circle cx="328.7" cy="100" r="4.5" fill="#1e222b"/><text x="322.7" y="90" text-anchor="end" fill="#1e222b">perihelio</text>
<line x1="65.2" y1="116" x2="255" y2="116" stroke="#0f6b5c" marker-start="url(#p)" marker-end="url(#p)"/><text x="160.1" y="132" text-anchor="middle" fill="#0f6b5c" font-style="italic">rₐ</text>
<line x1="261" y1="116" x2="325.7" y2="116" stroke="#0f6b5c" marker-start="url(#p)" marker-end="url(#p)"/><text x="293.4" y="132" text-anchor="middle" fill="#0f6b5c" font-style="italic">rₚ</text>
<line x1="328.7" y1="100.0" x2="328.7" y2="56.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="334.7" y="64" fill="#b5451b" font-style="italic">vₚ</text>
</svg>
