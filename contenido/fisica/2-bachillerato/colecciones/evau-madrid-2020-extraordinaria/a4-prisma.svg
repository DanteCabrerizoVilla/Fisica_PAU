<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230" font-family="system-ui, sans-serif" font-size="13">
<title>Prisma con la cara A vertical y la cara B inclinada, que forman un ángulo de 30° en el vértice superior. Un rayo horizontal llega perpendicular a la cara A, 5 cm por debajo del vértice</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<polygon points="90,20 90,218 204.3,218" fill="rgba(58,123,213,0.14)" stroke="#1e222b" stroke-width="1.5"/>
<text x="102.0" y="60.0" text-anchor="start" fill="#1e222b" font-size="12">30°</text>
<text x="80.0" y="188.0" text-anchor="end" fill="#1e222b" font-weight="700">A</text>
<text x="184.3" y="119.0" text-anchor="start" fill="#1e222b" font-weight="700">B</text>
<line x1="64.0" y1="20.0" x2="64.0" y2="130.0" stroke="#5a6170" marker-start="url(#p)" marker-end="url(#p)"/><text x="64.0" y="69.0" text-anchor="middle" fill="#5a6170"></text>
<text x="56.0" y="79.0" text-anchor="end" fill="#5a6170" font-size="12">5 cm</text>
<line x1="10.0" y1="130.0" x2="90.0" y2="130.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
</svg>
