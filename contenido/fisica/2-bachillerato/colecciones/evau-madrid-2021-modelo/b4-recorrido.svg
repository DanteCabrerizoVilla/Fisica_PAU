<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" font-family="system-ui, sans-serif" font-size="13">
<title>El haz entra sin desviarse por la cara AB y llega a la cara AC formando 45° con su normal. Con el índice adecuado sale rasante, a 90° de la normal, pegado a la cara AC</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<polygon points="180,20 117.9,170 242.1,170" fill="rgba(58,123,213,0.12)" stroke="#1e222b" stroke-width="1.5"/>
<text x="180.0" y="14.0" text-anchor="middle" fill="#1e222b" >A</text>
<text x="107.9" y="184.0" text-anchor="middle" fill="#1e222b" >B</text>
<text x="252.1" y="184.0" text-anchor="middle" fill="#1e222b" >C</text>
<text x="180.0" y="66.0" text-anchor="middle" fill="#1e222b" font-size="12">45°</text>
<line x1="71.9" y1="71.9" x2="145.8" y2="102.5" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="145.8" y1="102.5" x2="228.3" y2="136.7" stroke="#b5451b" stroke-width="2"/>
<line x1="228.3" y1="136.7" x2="258.9" y2="210.6" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<line x1="191.4" y1="152.0" x2="274.5" y2="117.5" stroke="#5a6170" stroke-width="1" stroke-dasharray="4 4"/>
<text x="198.3" y="138.7" text-anchor="end" fill="#0f6b5c" font-size="12">45°</text>
<text x="282.3" y="176.7" text-anchor="start" fill="#0f6b5c" font-size="12">sale rasante a 90°</text>
</svg>
