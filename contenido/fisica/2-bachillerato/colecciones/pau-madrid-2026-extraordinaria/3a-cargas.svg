<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 226" width="310" height="226" font-family="system-ui, sans-serif" font-size="13">
<title>Carga q1 en el origen, carga q2 en (0, 5) cm y campos de cada una en el punto P (5, 0) cm</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="20" y1="190" x2="290" y2="190" stroke="#5a6170" marker-end="url(#p)"/><text x="294" y="194" fill="#5a6170" font-style="italic">x</text>
<line x1="70" y1="216" x2="70" y2="14" stroke="#5a6170" marker-end="url(#p)"/><text x="76" y="18" fill="#5a6170" font-style="italic">y</text>
<line x1="70" y1="60" x2="200" y2="190" stroke="#5a6170" stroke-dasharray="4 4"/><text x="143.0" y="119.0" fill="#5a6170" font-style="italic">d₂</text>
<circle cx="70" cy="190" r="11" fill="#b5451b"/><text x="70" y="195" text-anchor="middle" fill="#fff" font-weight="700">+</text><text x="70" y="174" text-anchor="middle" fill="#1e222b">q₁</text>
<circle cx="70" cy="60" r="11" fill="#3a7bd5"/><text x="70" y="65" text-anchor="middle" fill="#fff" font-weight="700">−</text><text x="70" y="44" text-anchor="start" fill="#1e222b">q₂ = −10 nC</text>
<line x1="200.0" y1="190.0" x2="260.0" y2="190.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="244" y="208" fill="#b5451b" font-style="italic">E₁</text>
<line x1="200.0" y1="190.0" x2="158.0" y2="148.0" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#p)"/>
<text x="142" y="150" fill="#3a7bd5" font-style="italic">E₂</text>
<circle cx="200" cy="190" r="4" fill="#1e222b"/><text x="200" y="208" text-anchor="middle" fill="#1e222b">P (5, 0) cm</text>
</svg>
