<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" font-family="system-ui, sans-serif" font-size="13">
<title>Tres cargas en los vértices de un triángulo equilátero de 4 cm de lado; sobre Q3 actúan una fuerza de atracción hacia Q1 y una de repulsión que la aleja de Q2</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<polygon points="60,190 140.0,51.4 220,190" fill="none" stroke="#5a6170" stroke-dasharray="4 4"/>
<circle cx="60" cy="190" r="11" fill="#b5451b"/><text x="60" y="195" text-anchor="middle" fill="#fff" font-weight="700">+</text><text x="60" y="218" text-anchor="middle" fill="#1e222b">Q₁ = 4 nC</text>
<circle cx="220" cy="190" r="11" fill="#3a7bd5"/><text x="220" y="195" text-anchor="middle" fill="#fff" font-weight="700">−</text><text x="220" y="218" text-anchor="middle" fill="#1e222b">Q₃ = −4 nC</text>
<circle cx="140" cy="51.43593539448983" r="11" fill="#3a7bd5"/><text x="140" y="56.43593539448983" text-anchor="middle" fill="#fff" font-weight="700">−</text><text x="140" y="35.43593539448983" text-anchor="middle" fill="#1e222b">Q₂ = −2 nC</text>
<line x1="208.0" y1="190.0" x2="146.0" y2="190.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="160" y="182" fill="#b5451b" font-style="italic">F₁₃</text>
<line x1="226.0" y1="200.0" x2="246.0" y2="234.6" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#p)"/>
<text x="252" y="230" fill="#3a7bd5" font-style="italic">F₂₃</text>
<text x="140.0" y="234" text-anchor="middle" fill="#5a6170">lado: 4 cm</text>
</svg>
