<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 234" width="300" height="234" font-family="system-ui, sans-serif" font-size="13">
<title>Los dos hilos vistos de frente: el primero, con corriente saliente, en z = 2 cm; el segundo, con corriente entrante, en y = 2 cm. En el origen, el campo del primero va hacia +y y el del segundo hacia +z</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="30" y1="170" x2="270" y2="170" stroke="#5a6170" marker-end="url(#p)"/><text x="274" y="174" fill="#5a6170" font-style="italic">y</text>
<line x1="70" y1="200" x2="70" y2="16" stroke="#5a6170" marker-end="url(#p)"/><text x="76" y="20" fill="#5a6170" font-style="italic">z</text>
<line x1="70" y1="82" x2="158" y2="170" stroke="#5a6170" stroke-dasharray="4 4"/>
<circle cx="70" cy="82" r="10" fill="#fff" stroke="#b5451b" stroke-width="2"/><circle cx="70" cy="82" r="3" fill="#b5451b"/><text x="86" y="78" fill="#b5451b">I₁ = 5 A (sale)</text>
<circle cx="158" cy="170" r="10" fill="#fff" stroke="#3a7bd5" stroke-width="2"/><path d="M153 165 L163 175 M153 175 L163 165" stroke="#3a7bd5" stroke-width="2"/><text x="158" y="198" text-anchor="middle" fill="#3a7bd5">I₂ = 3 A (entra)</text>
<line x1="70.0" y1="170.0" x2="132.0" y2="170.0" stroke="#b5451b" stroke-width="3" marker-end="url(#p)"/>
<text x="110" y="162" fill="#b5451b" font-style="italic">B₁</text>
<line x1="70.0" y1="170.0" x2="70.0" y2="132.0" stroke="#3a7bd5" stroke-width="3" marker-end="url(#p)"/>
<text x="62" y="144" text-anchor="end" fill="#3a7bd5" font-style="italic">B₂</text>
<text x="62" y="186" text-anchor="end" fill="#5a6170">O</text><text x="56" y="86" text-anchor="end" fill="#5a6170">2 cm</text>
<text x="150" y="226" text-anchor="middle" fill="#5a6170" font-size="12">Vista desde el eje x positivo: el eje x sale del papel</text>
</svg>
