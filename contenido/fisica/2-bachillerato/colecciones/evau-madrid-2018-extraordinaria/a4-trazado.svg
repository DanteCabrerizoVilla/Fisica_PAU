<line x1="320.0" y1="174.0" x2="410.0" y2="174.0" stroke="#5a6170" marker-start="url(#p)" marker-end="url(#p)"/><text x="365.0" y="168.0" text-anchor="middle" fill="#5a6170">15 cm</text>
</svg>
