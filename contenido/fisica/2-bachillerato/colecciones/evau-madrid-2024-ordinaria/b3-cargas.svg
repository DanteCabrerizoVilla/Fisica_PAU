<line x1="50.0" y1="150.0" x2="170.0" y2="90.0" stroke="#5a6170" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="290.0" y1="150.0" x2="170.0" y2="90.0" stroke="#5a6170" stroke-width="1.2" stroke-dasharray="4 4"/>
