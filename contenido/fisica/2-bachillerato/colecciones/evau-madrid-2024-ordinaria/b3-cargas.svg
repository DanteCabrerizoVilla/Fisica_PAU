<circle cx="290" cy="150" r="11" fill="#b5451b"/><text x="290" y="155" text-anchor="middle" fill="#fff" font-weight="700">+</text><text x="290" y="178" text-anchor="middle" fill="#1e222b">+9 nC</text>
<line x1="170.0" y1="90.0" x2="206.0" y2="72.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<line x1="170.0" y1="90.0" x2="134.0" y2="72.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
