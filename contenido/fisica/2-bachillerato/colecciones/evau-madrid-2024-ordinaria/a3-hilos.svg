<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" font-family="system-ui, sans-serif" font-size="13">
<title>Vista desde el eje z: hilo 1 con corriente saliente en el origen e hilo 2 con corriente entrante en x = 5 cm. El campo se anula en x = 10 cm; en x = −5 cm el campo del hilo 1 apunta hacia abajo y es mayor que el del hilo 2, que apunta hacia arriba</title>
