<line x1="80.0" y1="80.0" x2="80.0" y2="126.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="72.0" y="124.0" text-anchor="end" fill="#b5451b" font-style="italic">B₁</text>
