<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 196" width="380" height="196" font-family="system-ui, sans-serif" font-size="13">
<title>Tres niveles de energía. El material absorbe un fotón de 450 nm y el electrón sube del nivel fundamental al segundo nivel, a 2,76 eV. Cae después al primer nivel, a 2,07 eV, y desde ahí al fundamental emitiendo un fotón de 600 nm</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="60.0" y1="176.0" x2="230.0" y2="176.0" stroke="#1e222b" stroke-width="2.5"/>
<text x="238.0" y="180.0" text-anchor="start" fill="#1e222b" font-size="12">fundamental (0)</text>
<text x="52.0" y="180.0" text-anchor="end" fill="#5a6170" font-size="12">0</text>
<line x1="60.0" y1="72.0" x2="230.0" y2="72.0" stroke="#1e222b" stroke-width="2.5"/>
<text x="238.0" y="76.0" text-anchor="start" fill="#1e222b" font-size="12">primer nivel (1)</text>
<text x="52.0" y="76.0" text-anchor="end" fill="#5a6170" font-size="12">2,07 eV</text>
<line x1="60.0" y1="30.0" x2="230.0" y2="30.0" stroke="#1e222b" stroke-width="2.5"/>
<text x="238.0" y="34.0" text-anchor="start" fill="#1e222b" font-size="12">segundo nivel (2)</text>
<text x="52.0" y="34.0" text-anchor="end" fill="#5a6170" font-size="12">2,76 eV</text>
<line x1="100.0" y1="176.0" x2="100.0" y2="32.0" stroke="#3a7bd5" stroke-width="2" marker-end="url(#p)"/>
<text x="94.0" y="110.0" text-anchor="end" fill="#3a7bd5" font-size="12">absorbe</text>
<text x="94.0" y="126.0" text-anchor="end" fill="#3a7bd5" font-size="12" font-weight="700">450 nm</text>
<path d="M150 30 C 162 40 162 62 150 72" fill="none" stroke="#5a6170" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#p)"/><text x="168.0" y="54.0" text-anchor="start" fill="#5a6170" font-size="11">de (2) a (1)</text>
<line x1="190.0" y1="72.0" x2="190.0" y2="174.0" stroke="#b5451b" stroke-width="2" marker-end="url(#p)"/>
<text x="198.0" y="130.0" text-anchor="start" fill="#b5451b" font-size="12">emite</text>
<text x="198.0" y="146.0" text-anchor="start" fill="#b5451b" font-size="12" font-weight="700">600 nm</text>
</svg>
