<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 210" width="450" height="210" font-family="system-ui, sans-serif" font-size="13">
<title>Lente convergente de focal 20 cm usada como lupa: objeto a 10 cm; las prolongaciones de los rayos refractados se cortan a 20 cm, en el mismo lado que el objeto, formando una imagen virtual, derecha y de doble tamaño</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs>
<line x1="10.0" y1="130.0" x2="440.0" y2="130.0" stroke="#5a6170" stroke-width="1.2"/>
<line x1="250.0" y1="14" x2="250.0" y2="196" stroke="#3a7bd5" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)"/>
<circle cx="70.0" cy="130" r="3" fill="#1e222b"/><text x="70.0" y="148.0" text-anchor="middle" fill="#1e222b" font-style="italic">F</text>
<circle cx="430.0" cy="130" r="3" fill="#1e222b"/><text x="430.0" y="148.0" text-anchor="middle" fill="#1e222b" font-style="italic">F′</text>
<line x1="160.0" y1="130.0" x2="160.0" y2="94.0" stroke="#1e222b" stroke-width="2.5" marker-end="url(#p)"/>
<line x1="70.0" y1="130.0" x2="70.0" y2="58.0" stroke="#b5451b" stroke-width="2.5" marker-end="url(#p)"/>
<polyline points="160.0,94.0 250.0,94.0 430.0,130" fill="none" stroke="#0f6b5c" stroke-width="1.6"/>
<line x1="250.0" y1="94.0" x2="70.0" y2="58.0" stroke="#0f6b5c" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="160.0" y1="94.0" x2="358.0" y2="173.2" stroke="#0f6b5c" stroke-width="1.6"/>
<line x1="160.0" y1="94.0" x2="70.0" y2="58.0" stroke="#0f6b5c" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="168.0" y="88.0" text-anchor="start" fill="#1e222b" >objeto</text>
<text x="62.0" y="62.0" text-anchor="end" fill="#b5451b" >imagen</text>
</svg>
