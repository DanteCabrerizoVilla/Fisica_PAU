<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 250" width="390" height="250" font-family="system-ui, sans-serif" font-size="13">
<title>Sistema de dos lentes. La lente A forma una imagen real e invertida a 20 cm, que queda a 5 cm de la lente B, entre B y su foco. La lente B hace de lupa: los rayos salen divergentes y sus prolongaciones forman una imagen final virtual, invertida y de 28 mm, 17,5 cm a la izquierda de B</title>
