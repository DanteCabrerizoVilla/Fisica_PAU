<circle cx="232.0" cy="120" r="2.5" fill="#1e222b"/><text x="232.0" y="136.0" text-anchor="middle" fill="#1e222b" font-size="11">F<tspan baseline-shift="sub" font-size="9">B</tspan></text>
<circle cx="358.0" cy="120" r="2.5" fill="#1e222b"/><text x="358.0" y="136.0" text-anchor="middle" fill="#1e222b" font-size="11">F′<tspan baseline-shift="sub" font-size="9">B</tspan></text>
<polyline points="25.0,111.2 70.0,111.2 250.0,155.2" fill="none" stroke="#0f6b5c" stroke-width="1.5"/>
