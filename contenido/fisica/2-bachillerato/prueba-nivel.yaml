      - enunciado: 'Una cuerda de longitud $L$, fija por los dos extremos, vibra en su segundo armónico. La longitud de onda es…'
        opciones:
          - '$L$'
          - '$2L$'
          - '$L/2$'
          - '$L/4$'

  # ---- Óptica -----------------------------------------------------------------
  - id: opt-1
    bloque: optica
    subtema: refraccion
    mide: "Qué cambia en la luz al cambiar de medio"
    variantes:
      - enunciado: 'Un rayo de luz pasa del aire al vidrio. Al entrar en el vidrio…'
        opciones:
