    mide: "Nivel de intensidad sonora (decibelios)"
    variantes:
      - enunciado: 'Un altavoz produce en un punto un nivel de intensidad sonora de 60 dB. Diez altavoces iguales, colocados en el mismo sitio, producen en ese punto…'
        opciones:
