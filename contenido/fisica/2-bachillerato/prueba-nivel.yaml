  - id: onda-4
    bloque: ondas
    subtema: energia-intensidad
    mide: "Intensidad de una onda y distancia al foco"
    variantes:
      - enunciado: 'Un foco puntual emite ondas por igual en todas las direcciones. A 2 m del foco la intensidad es $I$. A 6 m es…'
        opciones:
          - '$I/9$'
          - '$I/3$'
          - '$I/6$'
          - '$I/36$'
      - enunciado: 'Un foco puntual emite ondas por igual en todas las direcciones. A 10 m del foco la intensidad es $I$. La intensidad vale $4I$ a una distancia de…'
        opciones:
