  - id: onda-3
    bloque: ondas
    subtema: mas
    mide: "Velocidad y aceleración en el movimiento armónico"
    variantes:
      - enunciado: 'Una partícula describe un movimiento armónico simple. Cuando pasa por la posición de equilibrio…'
        opciones:
          - 'su velocidad es máxima y su aceleración es nula.'
          - 'su velocidad y su aceleración son máximas.'
          - 'su velocidad es nula y su aceleración es máxima.'
          - 'su velocidad y su aceleración son nulas.'
      - enunciado: 'Una partícula describe un movimiento armónico simple. En los extremos de la oscilación…'
        opciones:
          - 'su velocidad es nula y su aceleración es máxima.'
          - 'su velocidad es máxima y su aceleración es nula.'
          - 'su velocidad y su aceleración son máximas.'
          - 'su velocidad y su aceleración son nulas.'
      - enunciado: 'En un movimiento armónico simple, la aceleración de la partícula es…'
