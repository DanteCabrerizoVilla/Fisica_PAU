          - 'se duplica.'

  - id: onda-5
    bloque: ondas
    subtema: onda-armonica
    mide: "Diferencia de fase entre dos puntos"
    variantes:
      - enunciado: 'Dos puntos de una onda armónica están separados media longitud de onda. Esos dos puntos…'
