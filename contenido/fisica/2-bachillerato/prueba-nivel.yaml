# Prueba de nivel. Dice al alumno EN QUÉ falla, no por qué: el porqué se trabaja
# en clase. Por eso las preguntas no llevan explicación ni se muestra la
# respuesta correcta.
#
# - Hay 30 preguntas (6 por bloque). Cada una tiene varias VARIANTES de la
#   misma idea y dificultad: a cada alumno le sale una al azar, de modo que
#   dos compañeros no hacen la misma prueba.
# - La PRIMERA opción de cada variante es la correcta; la página las baraja.
# - `mide` es lo que aparece en el resultado y en el informe que recibe Dante.
# - prueba-nivel.py comprueba con cálculo las respuestas marcadas como correctas.
#
# [REVISAR] Textos de presentación, de privacidad y de resultado: provisionales.

titulo: "Prueba de nivel"
entrada: "Descubre en media hora qué partes de la Física de la PAU llevas bien y cuáles te están costando puntos."
instrucciones: >-
  Son 30 preguntas de una sola respuesta, sin calculadora. Si no sabes una,
  marca «No lo sé»: acertar por suerte solo te da un resultado que no es el tuyo.
# Texto informativo sobre los datos. [REVISAR] Debe incluir quién es el
# responsable (nombre y contacto) y cómo pedir la baja o el borrado.
privacidad: >-
  Tu correo y tu resultado se envían a Dante, el profesor que mantiene esta
  web, para que pueda ver en qué fallas. Puedes pedir que se borren tus datos
  en cualquier momento escribiéndole.
consentimiento: "Quiero recibir por correo material de estudio e información sobre las clases."
resultado: >-
  Aquí tienes en qué fallas. El porqué de cada fallo, y cómo dejar de cometerlo,
  es lo que se trabaja en clase.
llamada_titulo: "¿Crees que necesitas clases?"
llamada_texto: >-
  Ponte en contacto conmigo. Ya tengo tu resultado, así que la primera clase
  va directa a lo que te cuesta.

preguntas:
  # ---- Gravitación ----------------------------------------------------------
  - id: grav-1
    bloque: gravitacion
    subtema: satelites
    mide: "Velocidad orbital y radio de la órbita"
    variantes:
      - enunciado: 'Un satélite pasa de una órbita circular de radio $r$ a otra de radio $4r$ alrededor del mismo planeta. Su velocidad orbital…'
        opciones:
          - 'se reduce a la mitad.'
          - 'se reduce a la cuarta parte.'
          - 'se duplica.'
          - 'no cambia.'
      - enunciado: 'Dos satélites describen órbitas circulares alrededor de la Tierra: el satélite A, de radio $r$, y el satélite B, de radio $9r$. La velocidad de B es…'
        opciones:
          - 'la tercera parte de la de A.'
          - 'la novena parte de la de A.'
          - 'el triple de la de A.'
          - 'igual a la de A.'
      - enunciado: 'Un satélite describe una órbita circular. Para que su velocidad orbital fuera el doble, el radio de la órbita tendría que ser…'
        opciones:
          - 'la cuarta parte.'
          - 'la mitad.'
          - 'el doble.'
          - 'el cuádruple.'

  - id: grav-2
    bloque: gravitacion
    subtema: energia
    mide: "Energía de un satélite en órbita"
    variantes:
      - enunciado: 'Un satélite de masa $m$ describe una órbita circular de radio $r$ alrededor de un planeta de masa $M$. Su energía mecánica es…'
        opciones:
          - '$-\dfrac{G M m}{2r}$'
          - '$-\dfrac{G M m}{r}$'
          - '$+\dfrac{G M m}{2r}$'
          - 'nula, porque la órbita es estable.'
      - enunciado: 'Un satélite en órbita circular tiene una energía cinética $E_c$. Su energía potencial gravitatoria es…'
        opciones:
          - '$-2E_c$'
          - '$-E_c$'
          - '$-E_c/2$'
          - '$+2E_c$'
      - enunciado: 'Un satélite en órbita circular tiene una energía mecánica $E$, que es negativa. Su energía cinética es…'
        opciones:
          - '$-E$'
          - '$-2E$'
          - '$-E/2$'
          - '$E$'

  - id: grav-3
    bloque: gravitacion
    subtema: campo-potencial
    mide: "Cómo cambia el campo gravitatorio con la distancia"
    variantes:
      - enunciado: 'En la superficie de la Tierra la gravedad vale $g_0$. A una altura sobre la superficie igual al radio de la Tierra vale…'
        opciones:
          - '$g_0/4$'
          - '$g_0/2$'
          - '$g_0/\sqrt{2}$'
          - '$g_0/8$'
      - enunciado: 'Un planeta tiene la misma masa que la Tierra y el doble de radio. Si en la superficie de la Tierra la gravedad vale $g_0$, en la superficie de ese planeta vale…'
        opciones:
          - '$g_0/4$'
          - '$g_0/2$'
          - '$2g_0$'
          - '$4g_0$'
      - enunciado: 'En la superficie de la Tierra la gravedad vale $g_0$. A una altura sobre la superficie igual al doble del radio de la Tierra vale…'
        opciones:
          - '$g_0/9$'
          - '$g_0/4$'
          - '$g_0/3$'
          - '$g_0/2$'

  - id: grav-4
    bloque: gravitacion
    subtema: kepler
    mide: "Tercera ley de Kepler"
    variantes:
      - enunciado: 'Dos satélites describen órbitas circulares de radios $r$ y $4r$ alrededor del mismo planeta. Si el periodo del primero es $T$, el del segundo es…'
        opciones:
          - '$8T$'
          - '$4T$'
          - '$2T$'
          - '$16T$'
      - enunciado: 'Un satélite describe una órbita circular de radio $r$ con periodo $T$. Otro satélite del mismo planeta tiene un periodo $8T$. El radio de su órbita es…'
        opciones:
          - '$4r$'
          - '$8r$'
          - '$2r$'
          - '$64r$'
      - enunciado: 'Dos planetas giran alrededor de la misma estrella en órbitas circulares de radios $r$ y $9r$. Si el periodo del primero es $T$, el del segundo es…'
        opciones:
          - '$27T$'
          - '$9T$'
          - '$3T$'
          - '$81T$'

  - id: grav-5
    bloque: gravitacion
    subtema: energia
    mide: "Velocidad de escape"
    variantes:
      - enunciado: 'La velocidad de escape desde la superficie de un planeta…'
        opciones:
          - 'no depende de la masa del objeto que se lanza.'
          - 'es mayor cuanto mayor es la masa del objeto que se lanza.'
          - 'es menor cuanto mayor es la masa del objeto que se lanza.'
          - 'coincide con la velocidad de un satélite en órbita a ras de la superficie.'
      - enunciado: 'Dos planetas tienen el mismo radio, pero la masa del segundo es cuatro veces la del primero. La velocidad de escape del segundo es…'
        opciones:
          - 'el doble que la del primero.'
          - 'cuatro veces la del primero.'
          - 'la mitad que la del primero.'
          - 'igual que la del primero.'
      - enunciado: 'Se lanza un objeto desde la superficie de un planeta exactamente con la velocidad de escape. Su energía mecánica es…'
        opciones:
          - 'nula.'
          - 'positiva.'
          - 'negativa.'
          - 'igual a su energía cinética inicial.'

  - id: grav-6
    bloque: gravitacion
    subtema: kepler
    mide: "Momento angular en una órbita elíptica"
    variantes:
      - enunciado: 'Un cometa describe una órbita elíptica alrededor del Sol. En el perihelio está a una distancia $r_p$ y lleva una velocidad $v_p$. En el afelio, a una distancia $3r_p$, su velocidad es…'
        opciones:
          - '$v_p/3$'
          - '$v_p/\sqrt{3}$'
          - '$v_p/9$'
          - '$v_p$, porque la energía se conserva.'
      - enunciado: 'Un planeta describe una órbita elíptica alrededor de su estrella. Su velocidad es…'
        opciones:
          - 'máxima en el punto más cercano a la estrella y mínima en el más lejano.'
          - 'máxima en el punto más lejano de la estrella y mínima en el más cercano.'
          - 'la misma en todos los puntos de la órbita.'
          - 'máxima en los dos puntos extremos y mínima entre ellos.'
      - enunciado: 'Un satélite en órbita elíptica lleva en el apogeo la mitad de la velocidad que en el perigeo. Si en el perigeo está a una distancia $r_p$ del centro del planeta, en el apogeo está a…'
        opciones:
          - '$2r_p$'
          - '$4r_p$'
          - '$\sqrt{2}\,r_p$'
          - '$r_p/2$'

  # ---- Electromagnetismo ----------------------------------------------------
  - id: elec-1
    bloque: electromagnetismo
    subtema: campo-electrico
    mide: "Campo y potencial de dos cargas"
    variantes:
      - enunciado: 'Dos cargas iguales y positivas están separadas una distancia $d$. En el punto medio del segmento que las une…'
        opciones:
          - 'el campo eléctrico es nulo y el potencial no.'
          - 'el campo eléctrico y el potencial son nulos.'
          - 'el potencial es nulo y el campo eléctrico no.'
          - 'ni el campo eléctrico ni el potencial son nulos.'
      - enunciado: 'Dos cargas del mismo valor y signos opuestos, $+q$ y $-q$, están separadas una distancia $d$. En el punto medio del segmento que las une…'
        opciones:
          - 'el potencial es nulo y el campo eléctrico no.'
          - 'el campo eléctrico es nulo y el potencial no.'
          - 'el campo eléctrico y el potencial son nulos.'
          - 'ni el campo eléctrico ni el potencial son nulos.'
      - enunciado: 'Dos cargas positivas, $q$ y $4q$, están separadas una distancia $d$. El punto del segmento que las une donde el campo eléctrico es nulo está…'
        opciones:
          - 'a una distancia $d/3$ de la carga $q$.'
          - 'a una distancia $d/3$ de la carga $4q$.'
          - 'en el punto medio.'
          - 'a una distancia $d/5$ de la carga $q$.'

  - id: elec-2
    bloque: electromagnetismo
    subtema: lorentz
    mide: "Movimiento de una carga en un campo magnético"
    variantes:
      - enunciado: 'Un protón entra en un campo magnético uniforme con velocidad perpendicular al campo. Mientras se mueve dentro del campo…'
        opciones:
          - 'cambia la dirección de su velocidad, pero no su energía cinética.'
          - 'aumenta su energía cinética.'
          - 'sigue en línea recta con velocidad constante.'
          - 'se va frenando hasta detenerse.'
      - enunciado: 'Un electrón se mueve en un campo magnético uniforme con velocidad paralela al campo. El electrón…'
        opciones:
          - 'sigue en línea recta con velocidad constante.'
          - 'describe una circunferencia.'
          - 'describe una hélice.'
          - 'se va frenando hasta detenerse.'
      - enunciado: 'El trabajo que realiza la fuerza magnética sobre una carga que se mueve en un campo magnético uniforme es…'
        opciones:
          - 'siempre nulo, porque la fuerza es perpendicular a la velocidad.'
          - 'positivo, porque la carga describe una circunferencia.'
          - 'nulo solo si la carga se mueve en línea recta.'
          - 'proporcional al radio de la trayectoria.'

  - id: elec-3
    bloque: electromagnetismo
    subtema: potencial-electrico
    mide: "Potencial, energía potencial y trabajo"
    variantes:
      - enunciado: 'Se deja en reposo una carga positiva en una región donde hay un campo eléctrico. La carga se mueve hacia…'
        opciones:
          - 'potenciales decrecientes, y su energía potencial disminuye.'
          - 'potenciales crecientes, y su energía potencial disminuye.'
          - 'potenciales decrecientes, y su energía potencial aumenta.'
          - 'potenciales crecientes, y su energía potencial aumenta.'
      - enunciado: 'Se deja en reposo un electrón en una región donde hay un campo eléctrico. El electrón se mueve hacia…'
        opciones:
          - 'potenciales crecientes, y su energía potencial disminuye.'
          - 'potenciales decrecientes, y su energía potencial disminuye.'
          - 'potenciales crecientes, y su energía potencial aumenta.'
          - 'potenciales decrecientes, y su energía potencial aumenta.'
      - enunciado: 'Una carga se desplaza entre dos puntos de una misma superficie equipotencial. El trabajo que realiza el campo eléctrico es…'
        opciones:
          - 'nulo, sea cual sea el camino.'
          - 'nulo solo si el camino es recto.'
          - 'positivo si la carga es positiva.'
          - 'proporcional a la distancia recorrida.'

  - id: elec-4
    bloque: electromagnetismo
    subtema: lorentz
    mide: "Radio, periodo y sentido de giro en un campo magnético"
    variantes:
      - enunciado: 'Un electrón y un protón entran con la misma velocidad, perpendicular al campo, en una región con un campo magnético uniforme. Entonces…'
        opciones:
          - 'el protón describe una circunferencia de radio mayor y giran en sentidos contrarios.'
          - 'describen circunferencias del mismo radio y giran en sentidos contrarios.'
          - 'el protón describe una circunferencia de radio mayor y giran en el mismo sentido.'
          - 'el electrón describe una circunferencia de radio mayor y giran en sentidos contrarios.'
      - enunciado: 'Una partícula cargada describe una circunferencia en un campo magnético uniforme. Si su velocidad se duplica…'
        opciones:
          - 'el radio se duplica y el periodo no cambia.'
          - 'el radio y el periodo se duplican.'
          - 'el radio no cambia y el periodo se reduce a la mitad.'
          - 'el radio se duplica y el periodo se reduce a la mitad.'
      - enunciado: 'Un protón y una partícula alfa (el doble de carga y cuatro veces más masa) entran con la misma velocidad, perpendicular al campo, en un campo magnético uniforme. El radio de la trayectoria de la partícula alfa es…'
        opciones:
          - 'el doble que el del protón.'
          - 'la mitad que el del protón.'
          - 'cuatro veces el del protón.'
          - 'igual que el del protón.'

  - id: elec-5
    bloque: electromagnetismo
    subtema: campo-magnetico
    mide: "Campo y fuerza entre hilos paralelos"
    variantes:
      - enunciado: 'Dos hilos rectos, largos y paralelos transportan corrientes del mismo sentido. Si la distancia entre ellos se duplica…'
        opciones:
          - 'siguen atrayéndose y la fuerza se reduce a la mitad.'
          - 'siguen atrayéndose y la fuerza se reduce a la cuarta parte.'
          - 'siguen repeliéndose y la fuerza se reduce a la mitad.'
          - 'siguen repeliéndose y la fuerza se reduce a la cuarta parte.'
      - enunciado: 'Dos hilos rectos, largos y paralelos transportan corrientes de sentidos contrarios. Si se duplica la intensidad de uno de ellos…'
        opciones:
          - 'siguen repeliéndose y la fuerza se duplica.'
          - 'siguen atrayéndose y la fuerza se duplica.'
          - 'siguen repeliéndose y la fuerza se cuadruplica.'
          - 'siguen atrayéndose y la fuerza se cuadruplica.'
      - enunciado: 'Dos hilos rectos, largos y paralelos transportan la misma intensidad en el mismo sentido. En el punto medio entre los dos hilos, el campo magnético total es…'
        opciones:
          - 'nulo.'
          - 'el doble del que crea un solo hilo.'
          - 'igual al que crea un solo hilo.'
          - 'la mitad del que crea un solo hilo.'

  - id: elec-6
    bloque: electromagnetismo
    subtema: induccion
    mide: "Inducción: cuándo hay fem y qué sentido tiene"
    variantes:
      - enunciado: 'Una espira está en reposo, perpendicular a un campo magnético uniforme, constante y muy intenso. La fuerza electromotriz inducida en la espira es…'
        opciones:
          - 'nula, porque el flujo magnético no cambia.'
          - 'máxima, porque el flujo magnético es máximo.'
          - 'proporcional al valor del campo magnético.'
          - 'proporcional a la superficie de la espira.'
      - enunciado: 'Una espira gira con velocidad angular constante en un campo magnético uniforme. La fuerza electromotriz inducida es máxima en los instantes en que…'
        opciones:
          - 'el flujo magnético a través de la espira es nulo.'
          - 'el flujo magnético a través de la espira es máximo.'
          - 'el plano de la espira es perpendicular al campo.'
          - 'la espira completa una vuelta.'
      - enunciado: 'Se acerca el polo norte de un imán a una espira. La corriente inducida en la espira crea un campo magnético que…'
        opciones:
          - 'se opone al aumento del flujo: la espira repele al imán.'
          - 'refuerza el aumento del flujo: la espira atrae al imán.'
          - 'tiene siempre el mismo sentido que el campo del imán.'
          - 'es nulo mientras el imán se mueve.'

  # ---- Ondas ------------------------------------------------------------------
  - id: onda-1
    bloque: ondas
    subtema: onda-armonica
    mide: "Leer la ecuación de una onda"
    variantes:
      - enunciado: 'Una onda se describe con $y(x,t) = 0{,}02\,\operatorname{sen}(10\pi t - 4\pi x)$, en unidades del SI. La onda se propaga…'
        opciones:
          - 'a 2,5 m/s hacia las $x$ positivas.'
          - 'a 2,5 m/s hacia las $x$ negativas.'
          - 'a 0,4 m/s hacia las $x$ positivas.'
          - 'a 0,63 m/s hacia las $x$ positivas.'
      - enunciado: 'Una onda se describe con $y(x,t) = 0{,}05\,\operatorname{sen}(6\pi t + 2\pi x)$, en unidades del SI. La onda se propaga…'
        opciones:
          - 'a 3 m/s hacia las $x$ negativas.'
          - 'a 3 m/s hacia las $x$ positivas.'
          - 'a 0,33 m/s hacia las $x$ negativas.'
          - 'a 0,94 m/s hacia las $x$ negativas.'
      - enunciado: 'Una onda se describe con $y(x,t) = 0{,}1\,\operatorname{sen}(4\pi t - \pi x)$, en unidades del SI. Su longitud de onda y su periodo son…'
