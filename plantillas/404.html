{% extends "base.html" %}

{% block titulo %}Página no encontrada · {{ sitio.nombre }}{% endblock %}

{% block contenido %}
<div class="ancho ancho--texto">
  <h1>Esta página no existe</h1>
  <p class="entrada">Puede que el enlace esté mal escrito o que el problema haya cambiado de sitio.</p>
  <p class="acciones">
    <a class="boton" href="{{ url() }}">Ir al inicio</a>
    <a class="boton boton--suave" href="{{ url(cursos[0].url) }}">Ver problemas</a>
  </p>
</div>
{% endblock %}
